#!/usr/sbin/nft -f

table inet xcplane {

    set cloudflare4 {
        type ipv4_addr
        flags interval
    }

    set cloudflare6 {
        type ipv6_addr
        flags interval
    }

    set ssh {
        type inet_service
    }

    set inbound {
        type inet_service
    }

    set outblocked4 {
        type ipv4_addr
        flags interval
    }

    set outblocked6 {
        type ipv6_addr
        flags interval
    }

    chain input {

        type filter hook input priority filter;
        policy accept;

        iif lo accept
        ct state established,related accept

        tcp dport @ssh accept

{% if cloudflare_only and cloudflare_proxied %}

        ip saddr @cloudflare4 tcp dport 443 accept
        ip6 saddr @cloudflare6 tcp dport 443 accept

        ip saddr @cloudflare4 udp dport 443 accept
        ip6 saddr @cloudflare6 udp dport 443 accept

        ip saddr @cloudflare4 tcp dport @inbound accept
        ip6 saddr @cloudflare6 tcp dport @inbound accept

        ip saddr @cloudflare4 udp dport @inbound accept
        ip6 saddr @cloudflare6 udp dport @inbound accept

{% else %}

        tcp dport 443 accept
        udp dport 443 accept

        tcp dport @inbound accept
        udp dport @inbound accept

{% endif %}

	icmpv6 type {
	    nd-router-solicit,
	    nd-router-advert,
	    nd-neighbor-solicit,
	    nd-neighbor-advert,

	    destination-unreachable,
	    packet-too-big,
	    time-exceeded,
	    parameter-problem
	} accept
    }

    chain output {

    	type filter hook output priority filter;
	policy accept;

        ct state established,related accept

        ip daddr @outblocked4 ct state new drop
	ip6 daddr @outblocked6 ct state new drop

    }

    chain forward {
    
    	type filter hook forward priority 0;
        policy drop;
	
    }   
}

