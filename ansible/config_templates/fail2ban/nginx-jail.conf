{% set nginx_banaction = 'cloudflare-ban' if cloudflare_proxied else 'nftables' %}

[nginx-exploit]
enabled  = true
backend  = auto
port     = https
filter   = nginx-exploit
logpath  = /var/log/nginx/*_access.log
maxretry = 2
findtime = 86400
bantime = 30d
banaction = {{ nginx_banaction }}

[nginx-badmethod]
enabled  = true
backend  = auto
port     = https
filter   = nginx-badmethod
logpath  = /var/log/nginx/*_access.log
maxretry = 1
findtime = 1d
bantime  = 30d
banaction = {{ nginx_banaction }}

[nginx-unknownpath]
enabled  = true
backend  = auto
port     = https
filter   = nginx-unknownpath
logpath  = /var/log/nginx/*_access.log
maxretry = 5
findtime = 120
bantime  = 1d
banaction = {{ nginx_banaction }}

[nginx-limit-req]
enabled  = true
backend  = auto
port     = https
filter   = nginx-limit-req
logpath  = /var/log/nginx/*_error.log
maxretry = 20
findtime = 5m
banaction = {{ nginx_banaction }}
