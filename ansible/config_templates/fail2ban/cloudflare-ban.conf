[Definition]

actionban = curl --fail --silent --show-error --max-time 10 -X POST \
          "https://api.cloudflare.com/client/v4/accounts/<accountid>/rules/lists/<listid>/items" \
          -H "Authorization: Bearer <token>" \
          -H "Content-Type: application/json" \
          --data '[{"ip":"<ip>","comment":"xcplane-banned"}]'

actionunban = ITEM_ID=$(curl --silent --fail --show-error --max-time 10 -X GET \
              "https://api.cloudflare.com/client/v4/accounts/<accountid>/rules/lists/<listid>/items?search=<ip>" \
              -H "Authorization: Bearer <token>" \
              | jq -r '.result[0].id // empty'); \
              if [ -n "$ITEM_ID" ]; then \
                  curl --fail --silent --show-error --max-time 10 -X DELETE \
                  "https://api.cloudflare.com/client/v4/accounts/<accountid>/rules/lists/<listid>/items" \
                  -H "Authorization: Bearer <token>" \
                  -H "Content-Type: application/json" \
                  --data "{\"items\":[{\"id\":\"$ITEM_ID\"}]}"; \
              fi

[Init]

accountid = {{ cloudflare_account }}
token = {{ cloudflare_token }}
listid = {{ cloudflare_list }}
