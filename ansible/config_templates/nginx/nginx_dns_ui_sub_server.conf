limit_req_zone $binary_remote_addr zone=dns:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ui:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=sub:10m rate=1r/s;

# Because we might be mixing Cloudflare-protected servers (DNS & UI) with a
# fully public one (subscription) in one host with one IP:
# - Cloudflare-only nftables rules can't be set (unless every inbound port is
#   from the Cloudflare secure ports - cloudflare_only)
# - set_real_ip_from directive can't be mixed with allow/deny rules
#
# Instead, we only set allow/deny rules for proxied connection here, and
# construct our own log format where the first item in the log will always be
# the real IP in all cases.
# - allow/deny always checks the TCP peer (CF edge or direct client)
# - $remote_addr remains the direct IP or Cloudflare edge IP
# - $http_cf_connecting_ip will contain the real visitor IP in proxied connections

{% if cloudflare_proxied %}
map $http_cf_connecting_ip $client_ip_for_log {
    # This map catches internal or local/LAN requests
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
{% endif %}

log_format xcplane
    '{% if cloudflare_proxied %}$client_ip_for_log{% else %}$remote_addr{% endif %} '
    '- $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for" '
    '$request_time $upstream_response_time';

####################### The DNS server #######################
server {
{% if cloudflare_proxied %}
    include conf.d/cloudflare_allow.inc;
{% endif %}
    
    http2 on;
    http3 on;
    # We don't listen on 80
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;  # HTTP/3
    listen [::]:443 quic reuseport;
    # If ipv6 is not defined here, then the entry for ipv6 resolution in
    # /etc/hosts needs to be removed, or dnscrypt-proxy might not pick the
    # server. This is because IPv6 stack is enabled globally at kernel level.

    server_name {{ dns_hostname }};

    ssl_certificate     /etc/ssl/certs/{{ base_hostname }}-fullchain.crt;
    ssl_certificate_key /etc/ssl/private/{{ base_hostname }}.key;

    access_log /var/log/nginx/dns_access.log xcplane;
    error_log /var/log/nginx/dns_error.log;
    
    # TLS Hardening
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # HTTP/3 QUIC support
    ssl_early_data on;
    add_header Alt-Svc 'h3=":443"'; # advertise HTTP/3
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Hide Nginx info
    server_tokens off;

    # Catch all other unmatched paths or hosts
    location / {
        limit_req zone=dns burst=5 nodelay;
        
        return 404 "Not found.\n";
        add_header Content-Type text/plain;
    }

    location = /{{ secrets.doh_endpoint }} {
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_connect_timeout 15s;
        grpc_read_timeout 30s;
        grpc_send_timeout 30s;

        grpc_pass grpc://127.0.0.1:{{ unbound_https_port }};
    }
}

####################### The UI server/reverse proxy #######################
server {
{% if cloudflare_proxied %}
    include conf.d/cloudflare_allow.inc;
{% endif %}
    
    http2 on;
    http3 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    
    server_name {{ ui_hostname }};

    ssl_certificate     /etc/ssl/certs/{{ base_hostname }}-fullchain.crt;
    ssl_certificate_key /etc/ssl/private/{{ base_hostname }}.key;

    access_log /var/log/nginx/ui_access.log xcplane;
    error_log /var/log/nginx/ui_error.log;

    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    location / {
        limit_req zone=ui burst=8 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://127.0.0.1:{{ ui_webport }};
    }

    location = /{{ secrets.health_path }} {
        # Custom header to prove we reached Nginx
        add_header X-Health-Verify "my-origin-server" always;
        # No caching whatsoever
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;

        return 200 "OK";
    }
}

####################### The subscription server #######################
server {
{% if cloudflare_proxied and cloudflare_only %}
    # Note: not every inbound type is compatible with Cloudflare
    include conf.d/cloudflare_allow.inc;
{% endif %}

    http2 on;
    http3 on;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name {{ sub_hostname }};

    ssl_certificate     /etc/ssl/certs/{{ base_hostname }}-fullchain.crt;
    ssl_certificate_key /etc/ssl/private/{{ base_hostname }}.key;

{% if cloudflare_proxied and cloudflare_only %}
    access_log /var/log/nginx/sub_access.log xcplane;
{% else %}
    access_log /var/log/nginx/sub_access.log;
{% endif %}

    error_log /var/log/nginx/sub_error.log;

    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    server_tokens off;
    location / {
        limit_req zone=sub burst=5 nodelay;
        
        proxy_set_header Host $host; # preserve the original host header
        proxy_set_header X-Forwarded-Host {{ sub_hostname }}; # send the real sub address in the json sub config 
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Preserve forwarded headers

        proxy_pass http://127.0.0.1:{{ sub_port }};        
    }
}
