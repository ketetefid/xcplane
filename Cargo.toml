[package]
name = "xcplane"
version = "0.1.2"
edition = "2024"
authors = ["Kete Tefid <ketetefid@gmail.com>"]
description = "Infrastructure control plane for a privacy-first server fleet."

[dependencies]
# Configuration file parsing engine
toml = "1.1"
toml_edit = "0.25"

# Async processing engine
tokio = { version = "1.49.0", features = ["full"] }

# If we check service health through a socks5 proxy
tokio-socks = "0.5.2"

# DB engine
tokio-rusqlite = "0.7"
rusqlite = { version = "0.37", features = ["backup"] }

# Backbone of the internet calls
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12"
] }

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "socks",
    "cookies",
    "rustls-tls",
    "stream"
] }

rustls = { version = "0.23", default-features = false, features = [
    "std",
    "ring",
    "tls12"
] }
webpki-roots = "0.26"
#

# For processing compressed csv files off the internet
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
tokio-util = "0.7"
csv = "1.3"
#

# It's URL
url = { version = "2", features = ["serde"] }

# Processing and converting enums to other types
strum = "0.28"
strum_macros = "0.28"

# Geo-location decision-making
isocountry = "0.3.2"

# Providing capabilities of working with streams
futures-util = "0.3.30"

# Serializing & deserializing data
serde = { version = "1", features = ["derive", "rc"] }
serde_yaml = "0.9"
serde_json = "1"

# The action_map holding service health data and correct action joinhandles
dashmap = "5"

# For generating secrets
rand = "0.8"
base64 = "0.22"

# For creating Nginx health path
sha2 = "0.10"

# For processing date & time
chrono = "0.4"

# Holding the structs of 3X-UI login info & Cloudflare data
arc-swap = "1"

# Where to work in
directories = "5"

# root or normal user
users = "0.11"

# Linux signal processing commands
nix = { version = "0.31", features = ["process", "signal"] }

# CLI Argument parsing
clap = { version = "4.5", features = ["derive"] }

# Including Ansible sources directly into the binary
include_dir = "0.7"

# For checking Ansible version installed on the controller
semver = "1.0"

# The logging engine
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "env-filter",
    "time",
    "chrono",
    "json"
] }
tracing-appender = "0.2"
